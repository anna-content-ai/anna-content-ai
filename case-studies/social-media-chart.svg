<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Udział typów treści w wyświetleniach i interakcjach</title>
  <desc id="d">Instagram producent materiałów budowlanych, ostatnie 90 dni. Wyświetlenia: rolki 56,9%, posty 29,4%, relacje 13,8%. Interakcje: posty 50,2%, rolki 44,3%, relacje 5,5%.</desc>
  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0E0E0E">Zasięg a zaangażowanie: udział typów treści</text>
  <text x="40" y="78" font-size="15" fill="#6B6B67">Instagram, ostatnie 90 dni. Udział w procentach.</text>

  <!-- Legenda -->
  <rect x="40" y="100" width="14" height="14" fill="#0E0E0E"/>
  <text x="62" y="112" font-size="14" fill="#3A3A38">Wyświetlenia</text>
  <rect x="180" y="100" width="14" height="14" fill="#B8B8B2"/>
  <text x="202" y="112" font-size="14" fill="#3A3A38">Interakcje</text>

  <!-- Rolki -->
  <text x="40" y="168" font-size="16" font-weight="600" fill="#0E0E0E">Rolki</text>
  <rect x="200" y="148" width="520" height="22" fill="#F4F4F2" rx="4"/>
  <rect x="200" y="148" width="296" height="22" fill="#0E0E0E" rx="4"/>
  <text x="506" y="164" font-size="14" fill="#0E0E0E">56,9%</text>
  <rect x="200" y="176" width="520" height="22" fill="#F4F4F2" rx="4"/>
  <rect x="200" y="176" width="230" height="22" fill="#B8B8B2" rx="4"/>
  <text x="440" y="192" font-size="14" fill="#0E0E0E">44,3%</text>

  <!-- Posty -->
  <text x="40" y="236" font-size="16" font-weight="600" fill="#0E0E0E">Posty</text>
  <rect x="200" y="216" width="520" height="22" fill="#F4F4F2" rx="4"/>
  <rect x="200" y="216" width="153" height="22" fill="#0E0E0E" rx="4"/>
  <text x="363" y="232" font-size="14" fill="#0E0E0E">29,4%</text>
  <rect x="200" y="244" width="520" height="22" fill="#F4F4F2" rx="4"/>
  <rect x="200" y="244" width="261" height="22" fill="#B8B8B2" rx="4"/>
  <text x="471" y="260" font-size="14" fill="#0E0E0E">50,2%</text>

  <!-- Relacje -->
  <text x="40" y="304" font-size="16" font-weight="600" fill="#0E0E0E">Relacje</text>
  <rect x="200" y="284" width="520" height="22" fill="#F4F4F2" rx="4"/>
  <rect x="200" y="284" width="72" height="22" fill="#0E0E0E" rx="4"/>
  <text x="282" y="300" font-size="14" fill="#0E0E0E">13,8%</text>
  <rect x="200" y="312" width="520" height="22" fill="#F4F4F2" rx="4"/>
  <rect x="200" y="312" width="29" height="22" fill="#B8B8B2" rx="4"/>
  <text x="239" y="328" font-size="14" fill="#0E0E0E">5,5%</text>

  <text x="40" y="382" font-size="14" fill="#3A3A38">Rolki dają zasięg, posty dają zaangażowanie.</text>
  <text x="40" y="408" font-size="12" fill="#6B6B67">Źródło: panel Instagram, ostatnie 90 dni. Szkic do akceptacji.</text>
</svg>
